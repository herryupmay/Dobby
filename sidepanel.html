<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dobby</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Inline SVG symbol — referenced wherever the brand mark is needed -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="dobby-mark" viewBox="0 0 128 128">
      <rect width="128" height="128" rx="24" fill="#2563eb"/>
      <path d="M 32 26 Q 32 22 36 22 L 90 22 Q 94 22 94 26 L 94 40 Q 94 44 90 44 L 84 44 L 84 78 Q 84 86 90 92 L 100 100 Q 108 106 104 112 Q 100 118 92 114 L 50 100 Q 38 96 38 84 L 38 44 L 36 44 Q 32 44 32 40 Z" fill="#ffffff"/>
      <rect x="36" y="36" width="54" height="3" rx="1.5" fill="#2563eb" opacity="0.18"/>
      <g transform="translate(102 28)" fill="#fde047">
        <path d="M 0 -11 C 1.5 -2 2 -1.5 11 0 C 2 1.5 1.5 2 0 11 C -1.5 2 -2 1.5 -11 0 C -2 -1.5 -1.5 -2 0 -11 Z"/>
      </g>
      <g transform="translate(112 48)" fill="#fde047">
        <path d="M 0 -5 C 0.7 -1 1 -0.7 5 0 C 1 0.7 0.7 1 0 5 C -0.7 1 -1 0.7 -5 0 C -1 -0.7 -0.7 -1 0 -5 Z"/>
      </g>
    </symbol>
  </svg>

  <header>
    <div class="header-row">
      <div class="title">
        <svg class="brand-icon" aria-hidden="true"><use href="#dobby-mark"/></svg>
        <h1 id="app-name">Dobby</h1>
      </div>
      <div class="controls">
        <select id="language" title="Language">
          <option value="en">EN</option>
          <option value="zh-Hant">繁中</option>
        </select>
        <button id="settings" title="Settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
        <button id="new-chat" title="Start fresh">↻</button>
      </div>
    </div>
    <div id="status" class="status">Waking Dobby up…</div>
    <div class="usage-bar">
      <div id="usage-fill" class="usage-fill"></div>
    </div>
    <div id="usage-text" class="usage-text"></div>
    <div id="warning" class="warning hidden"></div>
  </header>

  <section id="settings-panel" class="settings-panel hidden" aria-label="Settings">
    <h2 id="settings-header" class="settings-header">Custom system prompt</h2>
    <p id="settings-hint" class="settings-hint">Override Dobby's default personality. Saving starts a fresh chat.</p>
    <textarea id="settings-textarea" rows="8" placeholder="Tell Dobby how to behave..."></textarea>
    <div class="settings-meta">
      <span id="settings-charcount" class="settings-charcount"></span>
      <span id="settings-longwarn" class="settings-longwarn hidden"></span>
    </div>
    <div class="settings-actions">
      <button id="settings-reset" type="button" class="settings-btn-secondary">Reset to default</button>
      <button id="settings-save" type="button" class="settings-btn-primary">Save</button>
    </div>
  </section>

  <main id="messages" class="messages">
    <div id="empty-state" class="empty-state">
      <svg class="hero-icon" aria-hidden="true"><use href="#dobby-mark"/></svg>
      <p id="empty-title" class="empty-title">Dobby is a free elf!</p>
      <p id="empty-hint" class="hint">Dobby runs on your computer. No internet, no servers.</p>
    </div>
  </main>

  <footer>
    <form id="chat-form">
      <textarea
        id="input"
        rows="2"
        placeholder="Ask Dobby... (Shift+Enter for newline)"
        disabled></textarea>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </footer>

  <script src="marked.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
